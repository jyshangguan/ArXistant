# Runtime settings for ArXistant

llm:
  # Provider: "openai_compatible" for any OpenAI-compatible API (Zhipu, Qwen, etc.)
  provider: openai_compatible
  model: glm-5-turbo
  base_url: https://open.bigmodel.cn/api/coding/paas/v4
  # API key is read from GLM_API_KEY in .env
  temperature: 0.1

arxiv:
  max_results: 100          # max papers to fetch per category
  days_back: 3              # only consider papers published in the last N days

filter:
  batch_size: 6             # papers per LLM call
  batch_delay: 5            # seconds to wait between batches (to avoid rate limits)
  relevance_threshold: 4    # minimum score (1-5) to include in report

report:
  output_dir: reports       # directory for generated reports

database:
  path: data/arxistant.db   # SQLite database file (set to "" for legacy filter-only mode)

candidates:
  path: data/candidates.yaml  # file for candidate node review

reading:
  max_text_chars: 80000       # max chars of full text sent to LLM
  html_timeout: 30             # HTTP timeout for arXiv HTML fetch

feishu:
  app_id: ""                   # FEISHU_APP_ID env var
  app_secret: ""               # FEISHU_APP_SECRET env var
  verification_token: ""       # from Feishu developer console
  encrypt_key: ""              # optional
  bot_name: ArXistant

bot:
  target_chat_id: "oc_2c50a087092cae01edfc1f3c034d9bb6"           # chat_id for scheduled report push
  session_max_messages: 20
  report_cron: "30 10 * * 1-5"

verifier:
  enabled: true
  max_points: 5                    # max scientific points to verify per paper
  max_iterations: 1                # max gap-resolution iterations per point
  run_feynman: true                # enable Feynman-style explanation tests
  feynman_importance_threshold: 4  # only run Feynman for points with importance >= this
  logic_pass_threshold: 8          # logic score >= this counts as "well supported"
  feynman_pass_threshold: 8        # feynman score >= this counts as "well understood"
  max_context_chars: 20000         # max chars of paper context per LLM call
  store_certificates: true         # persist certificates in SQLite
  ask_user_on_gaps: true           # ask user via Feishu when stuck on gaps
  progress_interval: 30            # seconds between progress card updates
