# Runtime settings for ArXistant

llm:
  # Provider: "openai_compatible" for any OpenAI-compatible API (Zhipu, Qwen, etc.)
  provider: openai_compatible
  model: glm-4.7-flash
  base_url: https://open.bigmodel.cn/api/paas/v4
  # API key is read from GLM_API_KEY in .env
  temperature: 0.1

arxiv:
  max_results: 100          # max papers to fetch per category
  days_back: 3              # only consider papers published in the last N days

filter:
  batch_size: 6             # papers per LLM call
  batch_delay: 5            # seconds to wait between batches (to avoid rate limits)
  relevance_threshold: 4    # minimum score (1-5) to include in report

report:
  output_dir: reports       # directory for generated reports

database:
  path: data/arxistant.db   # SQLite database file (set to "" for legacy filter-only mode)

candidates:
  path: data/candidates.yaml  # file for candidate node review

reading:
  max_text_chars: 80000       # max chars of full text sent to LLM
  html_timeout: 30             # HTTP timeout for arXiv HTML fetch
