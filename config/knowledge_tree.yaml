# Knowledge tree for ArXistant
# Hierarchical research interests — the LLM links papers to these nodes
# and can propose new child nodes via candidate review.
#
# Customize with /build or edit this file and reset with /build.

tree:
  - name: Galaxy Evolution & Dynamics
    description: Dynamics, structure, and evolution of galaxies including bars, spirals, mergers, and stellar populations.
    categories: [astro-ph.GA]
    children:
      - name: Bar Formation & Secular Evolution
        description: Formation and evolution of galactic bars, bar-driven secular processes, box/peanut bulges.
        categories: [astro-ph.GA]
      - name: Spiral Structure & Density Waves
        description: Density wave theory, spiral arm formation, maintenance, and pattern speed measurements.
        categories: [astro-ph.GA]
      - name: Stellar Kinematics & Populations
        description: Stellar velocities, velocity dispersions, chemodynamical evolution, age-metallicity relations.
        categories: [astro-ph.GA]
      - name: Galaxy Mergers & Interactions
        description: Galaxy-galaxy interactions, major/minor mergers, tidal features, and post-merger evolution.
        categories: [astro-ph.GA]

  - name: High-Energy Astrophysics
    description: Transient and variable high-energy phenomena including GRBs, supernovae, TDEs, and compact objects.
    categories: [astro-ph.HE]
    children:
      - name: Gamma-Ray Bursts & Afterglows
        description: Observations and theory of GRBs (long and short), multi-wavelength afterglow emission.
        categories: [astro-ph.HE]
      - name: Supernovae & Kilonovae
        description: Core-collapse and thermonuclear supernovae, kilonovae, light curves, spectra, and nucleosynthesis.
        categories: [astro-ph.HE]
      - name: Tidal Disruption Events
        description: Stars disrupted by supermassive black holes, observational signatures and theoretical models.
        categories: [astro-ph.HE]
      - name: Compact Objects & Accretion
        description: Neutron stars, black holes, white dwarfs, accretion disk physics, X-ray binaries.
        categories: [astro-ph.HE]

  - name: Supermassive Black Holes & AGN
    description: Active galactic nuclei, AGN spectra, jets, feedback, and black hole-galaxy co-evolution.
    categories: [astro-ph.HE, astro-ph.GA]
    children:
      - name: AGN Spectra & Unification
        description: Broad/narrow emission line regions, spectral energy distributions, AGN classification schemes.
        categories: [astro-ph.HE]
      - name: Jet Physics
        description: Relativistic jets from AGN and microquasars, jet formation, collimation, and feedback.
        categories: [astro-ph.HE]
      - name: Black Hole Co-evolution
        description: M-sigma relation, AGN feedback on host galaxies, co-evolution of SMBHs and their hosts.
        categories: [astro-ph.HE, astro-ph.GA]
