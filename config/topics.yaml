# Research topics configuration
# Each topic defines a research area with keywords and arXiv categories to monitor.

topics:
  - name: Exoplanet Atmospheres and Characterization
    description: >
      Studies of exoplanetary atmospheres, including transmission spectroscopy,
      emission spectroscopy, atmospheric composition, escape processes,
      and techniques for characterizing exoplanet atmospheres (JWST, ARIEL, ground-based).
    keywords:
      - exoplanet atmosphere
      - transmission spectrum
      - emission spectrum
      - atmospheric escape
      - JWST
      - hot Jupiter atmosphere
      - super-Earth atmosphere
      - mini-Neptune atmosphere
      - retrieval
      - opacity
      - cloud
      - haze
    categories:
      - astro-ph.EP
      - astro-ph.SR

  - name: Stellar Activity and Host Stars
    description: >
      Stellar activity, starspots, flares, coronal mass ejections,
      stellar rotation, and their impact on exoplanet detection and habitability.
    keywords:
      - stellar activity
      - starspot
      - stellar flare
      - coronal mass ejection
      - stellar rotation
      - chromosphere
      - stellar magnetic field
      - photometric variability
      - stellar irradiance
      - habitable zone
    categories:
      - astro-ph.SR
      - astro-ph.EP
