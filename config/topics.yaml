# Research topics configuration
# Each topic defines a research area with keywords and arXiv categories to monitor.

topics:
  - name: Galactic Structure and Dynamics
    description: >
      Dynamics and structure of the Milky Way and external galaxies, including
      spiral arms, bars, bulges, dark matter halos, stellar kinematics,
      galactic formation and evolution, and secular processes.
    keywords:
      - galactic dynamics
      - Milky Way structure
      - spiral arm
      - bar formation
      - stellar kinematics
      - galactic rotation curve
      - dark matter halo
      - galactic evolution
      - disk galaxy
      - bulge
      - thick disk
      - tidal stream
    categories:
      - astro-ph.GA
      - astro-ph.HE

  - name: High-Energy Astrophysical Transients
    description: >
      Transient and variable high-energy phenomena including gamma-ray bursts,
      supernovae, tidal disruption events, fast radio bursts, neutrino sources,
      and multi-messenger observations of compact object mergers.
    keywords:
      - gamma-ray burst
      - supernova
      - tidal disruption event
      - fast radio burst
      - multi-messenger
      - gravitational wave
      - neutron star merger
      - X-ray transient
      - neutrino source
      - relativistic jet
      - compact object
    categories:
      - astro-ph.HE
      - astro-ph.GA
