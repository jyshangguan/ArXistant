<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArXistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="ArXistant" class="logo">
    <h1>ArXistant</h1>
  </div>

  <div id="server-section" class="server-section" style="display: none;">
    <div class="server-offline">
      <span class="server-icon">🔴</span>
      <span class="server-text">Server is offline</span>
    </div>
    <p id="server-help" class="server-help" hidden></p>
  </div>

  <!-- Primary full-size actions -->
  <div class="actions">
    <button id="btn-daily" class="btn btn-primary">
      <span class="icon">📅</span>
      <span class="label">Daily Papers</span>
    </button>

    <button id="btn-search" class="btn btn-primary">
      <span class="icon">🔍</span>
      <span class="label">Search arXiv</span>
    </button>

    <button id="btn-chat" class="btn btn-primary">
      <span class="icon">💬</span>
      <span class="label">Chat</span>
    </button>
  </div>

  <!-- Secondary compact actions in a single row -->
  <div class="compact-actions">
    <button id="btn-recent" class="btn btn-compact" title="Open Recent Papers">
      <span class="icon">📆</span>
      <span class="label">Recent Papers</span>
    </button>

    <button id="btn-db" class="btn btn-compact" title="Open Saved Papers">
      <span class="icon">📂</span>
      <span class="label">Saved Papers</span>
    </button>

    <button id="btn-ml" class="btn btn-compact" title="Open ML Features">
      <span class="icon">🧠</span>
      <span class="label">ML Features</span>
    </button>

    <button id="btn-pubs" class="btn btn-compact" title="Open My Publications">
      <span class="icon">📚</span>
      <span class="label">My Publications</span>
    </button>
  </div>

  <div class="footer">
    <a href="#" id="link-power" class="link-power">⏻ Stop Server</a>
    <a href="#" id="link-options" class="link-options">⚙️ Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
