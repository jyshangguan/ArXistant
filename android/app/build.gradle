plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.arxistant.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.arxistant.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Only build the ABIs we need. arm64-v8a covers all modern phones;
        // x86_64 is useful for emulators.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            // Chaquopy 15.0.1's bundled pip is incompatible with Python 3.13
            // (removed stdlib module 'cgi'). Use the system Python 3.9 for the
            // build/target, matching the desktop server's interpreter.
            buildPython "/usr/bin/python3"
            pip {
                install "numpy"
                install "scikit-learn"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Chaquopy pulls in old kotlin-stdlib-jdk7/jdk8 1.6.x artifacts, which collide
// with the merged kotlin-stdlib 1.8.x from AndroidX (Kotlin merged jdk7/jdk8
// into the main stdlib in 1.8). Drop the redundant old artifacts.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
