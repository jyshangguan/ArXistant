plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.arxistant.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.arxistant.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.1.3"

        // Only build the ABIs we need. arm64-v8a covers all modern phones;
        // x86_64 is useful for emulators.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            // Chaquopy 15.0.1's bundled pip is incompatible with Python 3.13
            // (removed stdlib module 'cgi'). Use the system Python 3.9 for the
            // build/target, matching the desktop server's interpreter.
            buildPython "/usr/bin/python3"
            pip {
                install "numpy"
                install "scikit-learn"
            }
        }
    }

    signingConfigs {
        release {
            // Reads android/keystore.properties (gitignored). Without it the
            // release build falls back to unsigned, which cannot be installed
            // over an existing signed install.
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
                storeFile = new File(propsFile.parentFile, props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // Give the release APK a stable, versioned filename for distribution.
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all {
                outputFileName = "arxistant-release.v${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Chaquopy pulls in old kotlin-stdlib-jdk7/jdk8 1.6.x artifacts, which collide
// with the merged kotlin-stdlib 1.8.x from AndroidX (Kotlin merged jdk7/jdk8
// into the main stdlib in 1.8). Drop the redundant old artifacts.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
